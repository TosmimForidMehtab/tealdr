[package]
name = "tealdr"
version = "0.1.0"
edition = "2021"
description = "A high-performance Telegram media downloader CLI tool"
license = "MIT"
authors = ["Your Name <your.email@example.com>"]
repository = "https://github.com/yourusername/tealdr"
keywords = ["telegram", "downloader", "media", "cli", "mtproto"]
categories = ["command-line-utilities", "network-programming"]
readme = "Readme.md"

[dependencies]
# Strictly locked to a fully stable, known-working ecosystem
grammers-client = "=0.7.0"
grammers-session = "=0.7.0"
grammers-mtproto = "=0.7.0"
grammers-mtsender = "=0.7.0"
grammers-tl-types = "=0.7.0"

tokio = { version = "1.35", features = ["full"] }
clap = { version = "4.4", features = ["derive", "env"] }
indicatif = "0.17"
anyhow = "1.0"
regex = "1.10"
futures = "0.3"
